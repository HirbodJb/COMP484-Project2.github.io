<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Take care of Mango, an orange tabby with a mischievous streak.">
    <title>Mango | Giga Pet</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <h1>My Giga Pet Mango</h1>
    </header>

    <main class="pet-game">
      <div class="pet-image-container">
        <img class="pet-image" src="images/Orange-Kitten.png" width="1254" height="1254"
             alt="Mango the orange tabby kitten">
        <span class="nap-effect" aria-hidden="true">zZz</span>
      </div>

      <section class="dashboard" aria-labelledby="pet-name">
        <div class="pet-heading">
          <h2 class="name" id="pet-name"></h2>
          <div class="mood-badge"><span>Mood</span> <strong class="mood"></strong></div>
        </div>

        <dl class="pet-stats">
          <div>
            <dt>Weight</dt>
            <dd><span class="weight"></span> <span class="stat-unit">lb</span></dd>
          </div>
          <div>
            <dt>Happiness</dt>
            <dd><span class="happiness"></span> <span class="stat-unit">wags/min</span></dd>
          </div>
          <div>
            <dt>Energy</dt>
            <dd class="energy"></dd>
          </div>
        </dl>

        <div class="button-container">
          <button type="button" class="treat-button" data-message="Yum! That was delicious.">Treat</button>
          <button type="button" class="play-button"
                  data-message='["That was fun! Let&#39;s play again.", "I caught the feather!", "The toy mouse started it."]'>Play</button>
          <button type="button" class="exercise-button" data-message="Whew! I need a break.">Exercise</button>
          <button type="button" class="nap-button" data-message="That nap felt great!">Nap</button>
        </div>

        <!-- I use a status region so screen readers can announce Mango's reactions. -->
        <p class="pet-message" role="status"></p>
      </section>
    </main>

    <!-- I defer script.js so jQuery can finish loading before the game starts. -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
